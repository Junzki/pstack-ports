name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify export integrity
        run: npm run verify

      - name: Run CLI and installer tests
        run: npm test
